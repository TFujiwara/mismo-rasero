[project]
name = "blueprint-disarm"
version = "0.1.0"
description = "Importador DISARM Red/Blue — blueprint §15, PROMPT 1"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "blueprint-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["disarm"]

[project.scripts]
disarm-import = "disarm.importer:main"
