[project]
name = "blueprint-mcp"
version = "0.1.0"
description = "Servidor MCP de ¿Quién manda? — verificar, competencias, normas, DISARM, trámites"
requires-python = ">=3.11"
dependencies = [
    # mcp 2.x — desde v2 FastMCP se llama MCPServer (mcp.server.mcpserver)
    "mcp>=2.0,<3",
    "blueprint-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[project.scripts]
blueprint-mcp = "mcp_server.server:main"
