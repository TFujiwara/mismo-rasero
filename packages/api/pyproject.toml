[project]
name = "blueprint-api"
version = "0.1.0"
description = "API FastAPI — blueprint §17"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.15",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "blueprint-scrapers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
api-serve = "app.main:run"
