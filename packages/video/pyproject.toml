[project]
name = "blueprint-video"
version = "0.1.0"
description = "Módulo de verificación de vídeo — blueprint §12 (SOLO verificación, sin generación de clips)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "blueprint-api",
]

[project.optional-dependencies]
# Modelos pesados — se instalan y ejecutan en Fase 6 (GPU recomendada):
#   uv sync --extra pipeline  &&  uv run video-ingest <url>
pipeline = [
    "yt-dlp>=2024.8.6",
    "faster-whisper>=1.0",
    "pyannote.audio>=3.1",
    "easyocr>=1.7",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video"]

[project.scripts]
video-ingest = "video.ingest:main"
